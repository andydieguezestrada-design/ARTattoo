pluginManagement {
    def flutterSdkPath = {
        def properties = new Properties()
        def localProperties = file('local.properties')
        if (localProperties.exists()) {
            localProperties.withInputStream { properties.load(it) }
        }
        def pathFromFile = properties.getProperty('flutter.sdk')
        def pathFromEnv = System.getenv('FLUTTER_ROOT')
        def resolved = pathFromFile ?: pathFromEnv
        assert resolved != null && !resolved.trim().isEmpty(), 'flutter.sdk not set in local.properties and FLUTTER_ROOT is unavailable'
        return resolved
    }()

    includeBuild("${flutterSdkPath}/packages/flutter_tools/gradle")

    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}

plugins {
    id 'dev.flutter.flutter-plugin-loader' version '1.0.0'
    id 'com.android.application' version '8.12.1' apply false
    id 'org.jetbrains.kotlin.android' version '2.2.20' apply false
}

rootProject.name = 'ARTattoo_Academy'
include ':app'
