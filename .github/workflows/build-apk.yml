name: ARTattoo Academy Build APK

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Compilar APK release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Configure Flutter Android SDK path
        shell: bash
        run: |
          printf 'flutter.sdk=%s\n' "$FLUTTER_ROOT" > android/local.properties

      - name: Install dependencies
        run: flutter pub get

      - name: Validate JSON assets
        shell: bash
        run: |
          find assets/data -type f -name '*.json' -print0 | while IFS= read -r -d '' file; do
            python3 -m json.tool "$file" > /dev/null
          done

      - name: Make Gradle wrapper executable
        run: chmod +x android/gradlew

      - name: Verify Gradle wrapper
        shell: bash
        run: |
          test -f android/gradle/wrapper/gradle-wrapper.properties
          test -f android/gradle/wrapper/gradle-wrapper.jar
          grep -q 'gradle-8\.14' android/gradle/wrapper/gradle-wrapper.properties

      - name: Flutter analyze
        run: flutter analyze --no-fatal-infos

      - name: Flutter test
        run: flutter test

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: artattoo-academy-release-apk
          path: build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error
